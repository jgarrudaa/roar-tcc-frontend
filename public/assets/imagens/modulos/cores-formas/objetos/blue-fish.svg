<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="title desc">
  <title id="title">Blue fish</title>
  <desc id="desc">A friendly blue fish facing left, with its tail on the right.</desc>

  <ellipse cx="155" cy="207" rx="91" ry="12" fill="#dce9f5"></ellipse>

  <!-- Cauda atrás do corpo -->
  <path d="M220 120 278 78v84l-58-42Z" fill="#3689dc" stroke="#205a9d" stroke-width="5" stroke-linejoin="round"></path>

  <!-- Barbatanas -->
  <path d="M143 69q15-35 48-24 17 6 22 29-31-12-70-5Z" fill="#3689dc" stroke="#205a9d" stroke-width="5" stroke-linejoin="round"></path>
  <path d="M142 171q25 27 58 19l-28 27q-27-7-30-46Z" fill="#8cc8ff" stroke="#205a9d" stroke-width="4" stroke-linejoin="round"></path>

  <!-- Corpo -->
  <path d="M244 120c-12-40-53-64-104-61-49 3-84 28-91 61 7 33 42 58 91 61 51 3 92-21 104-61Z" fill="#55a8f5" stroke="#205a9d" stroke-width="5"></path>

  <!-- Barbatana lateral e detalhes -->
  <path d="M166 126q25-13 43 1-15 24-39 25-10-10-4-26Z" fill="#8cc8ff" stroke="#205a9d" stroke-width="4" stroke-linejoin="round"></path>
  <path d="M128 91c-12 17-12 41 0 58" fill="none" stroke="#3182d2" stroke-width="6" stroke-linecap="round"></path>
  <path d="M75 104q18-18 40-11" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".48"></path>

  <!-- Olho e boca no lado esquerdo, indicando a direção -->
  <circle cx="91" cy="112" r="9" fill="#173f75"></circle>
  <circle cx="94" cy="109" r="3" fill="#fff"></circle>
  <path d="M48 126q10 7 19 0" fill="none" stroke="#173f75" stroke-width="4" stroke-linecap="round"></path>
</svg>