<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROAR — Cadastro Professor</title>
    <meta name="description" content="Cadastro do professor no sistema ROAR.">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../public/js/pages/auth/pages-auth-cadastro-professor-1.js"></script>
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css">
    <link rel="stylesheet" href="../../public/css/pages/pages-auth-cadastro-professor.css">
</head>
<body
    class="bg-quinary font-poppins font-light bg-cover bg-center bg-no-repeat h-screen flex items-center justify-center u-pages-auth-cadastro-professor-001"
   >

    <main class="flex h-[70%] w-[75%] mx-auto rounded-2xl">

        <!-- Painel esquerdo -->
        <section
            class="w-1/2 bg-cover bg-center bg-no-repeat rounded-tl-2xl rounded-bl-2xl text-secondary flex justify-center flex-col gap-12 pl-12 relative u-pages-auth-cadastro-professor-002"
           >

            <img src="../../public/assets/imagens/logo.png" alt="Logo ROAR" class="w-[200px] h-[80px]">
            <h1 class="text-3xl font-bold">Olá, Professor</h1>
            <p class="text-secondary text-[1.1rem]">
                <span class="text-primary">Junte-se a nós</span> e gerencie seus alunos.<br>
                Acompanhe o progresso de cada um<br>
                e personalize o aprendizado.
            </p>
            <img src="../../public/assets/imagens/dino2.png" alt="Mascote Dino" class="absolute w-[150px] h-[200px] right-[-2%] bottom-0 dino" id="dinoImg">
        </section>

        <!-- Painel direito: formulário -->
        <section class="w-1/2 bg-secondary rounded-tr-2xl rounded-br-2xl flex flex-col justify-center items-center">
            <form id="teacher-register-form" class="h-[85%] w-[75%] flex flex-col gap-5 mx-auto">
                <h1 class="text-2xl font-bold text-quinary">Crie sua conta!</h1>
                <h2 class="text-senary border-b-2 border-senary w-[16%]">Cadastro</h2>

                <input
                    type="text"
                    id="nomeInput"
                    placeholder="Nome"
                    class="w-full h-[45px] border border-[#00000027] rounded-lg px-4 focus:outline-none focus:border-[#ccc]">

                <input
                    type="email"
                    id="emailInput"
                    placeholder="E-mail"
                    class="w-full h-[45px] border border-[#00000027] rounded-lg px-4 focus:outline-none focus:border-[#ccc]">

                <input
                    type="text"
                    id="cpfInput"
                    placeholder="CPF"
                    maxlength="14"
                    class="w-full h-[45px] border border-[#00000027] rounded-lg px-4 focus:outline-none focus:border-[#ccc]">

                <div class="relative w-full">
                    <input
                        id="senha"
                        type="password"
                        placeholder="Senha"
                        class="w-full h-[45px] border border-[#00000027] rounded-lg px-4 pr-12 focus:outline-none focus:border-[#ccc]">
                    <span
                        id="toggleSenhaIcon"
                        class="toggle-password absolute top-1/2 right-4 -translate-y-1/2 w-6 h-6 text-gray-500 hover:text-gray-700 flex items-center justify-center"
                        title="Mostrar senha">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                    </span>
                </div>

                <button
                    type="submit"
                    class="w-full h-[45px] bg-senary text-secondary rounded-lg shadow-[0_0_10px_#0000003f] text-[1.02rem] font-semibold hover:bg-blue-700 transition-colors">
                    Cadastrar
                </button>

                <p>Já tem uma conta?
                    <a href="login-professor.html" class="text-senary font-semibold no-underline hover:underline">Fazer login</a>
                </p>
            </form>
        </section>
    </main>

<script src="../../public/js/pages/auth/pages-auth-cadastro-professor-2.js"></script>
<script type="module" src="../../public/js/pages/auth/cadastro-professor.js"></script>
</body>
</html>
