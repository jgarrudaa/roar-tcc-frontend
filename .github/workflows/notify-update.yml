name: Avisar sobre atualização do projeto

on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Criar notificação na minha cópia
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PERSONAL_REPO_TOKEN }}

          script: |
            const personalOwner = 'jgarrudaa';
            const personalRepo = 'roar-vercel';

            const commitSha = context.sha;
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${commitSha}`;

            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: commitSha
            });

            const commitMessage = commit.data.commit.message.split('\n')[0];
            const author = commit.data.author?.login || commit.data.commit.author?.name || 'Desconhecido';

            const title = `🔄 Nova atualização disponível — ${commitSha.substring(0, 7)}`;

            const body = [
              'O projeto colaborativo recebeu uma atualização na branch main.',
              '',
              `Mensagem: ${commitMessage}`,
              `Autor: ${author}`,
              `Commit: [${commitSha.substring(0, 7)}](${commitUrl})`,
              '',
              'Para atualizar a cópia: git fetch upstream, git merge upstream/main e git push origin main.',
              'Esta notificação não atualiza a cópia automaticamente.'
            ].join('\n');

            await github.rest.issues.create({
              owner: personalOwner,
              repo: personalRepo,
              title: title,
              body: body
            });
