<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROAR — Gerenciar Atividades</title>
    <meta name="description" content="Gerencie e desbloqueie atividades para os alunos na plataforma ROAR.">
    <link rel="stylesheet" href="../../public/css/global.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css">
    <link rel="stylesheet" href="../../public/css/pages/pages-professor-atividades.css">
</head>
<body class="teacher-area">
<div class="app-shell">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- SIDEBAR PROFESSOR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar__logo-wrap">
            <img src="../../public/assets/imagens/logo.svg" alt="Logo ROAR" class="sidebar__logo" onclick="window.location.href='inicio.html'">
            <button class="sidebar__toggle" id="sidebarToggle" aria-label="Minimizar menu"><i class="fi fi-br-menu-burger"></i></button>
        </div>
        <nav class="sidebar__nav">
            <a href="inicio.html"       class="sidebar__link"><i class="fi fi-br-home"></i><span>In&iacute;cio</span></a>
            <a href="alunos.html"     class="sidebar__link"><i class="fi fi-br-users"></i><span>Alunos</span></a>
            <a href="atividades.html" class="sidebar__link active"><i class="fi fi-br-puzzle-pieces"></i><span>Atividades</span></a>
            <a href="relatorios.html" class="sidebar__link"><i class="fi fi-br-chart-simple"></i><span>Relat&oacute;rios</span></a>
            <a href="perfil.html"     class="sidebar__link"><i class="fi fi-br-user"></i><span>Perfil</span></a>
        </nav>
        <div class="sidebar__footer">
            <a href="../auth/login-professor.html" class="sidebar__link"><i class="fi fi-br-exit"></i><span>Sair</span></a>
        </div>
    </aside>

    <!-- MAIN -->
    <div class="main-content">
        <header class="navbar">
            <div class="u-pages-professor-atividades-001">
                <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Abrir menu"><i class="fi fi-br-menu-burger"></i></button>
                <div class="navbar__page-title">
                    <h1>Atividades</h1>
                    <p>Consulte resultados e defina quais atividades estão disponíveis.</p>
                </div>
            </div>
            <div class="navbar__right u-pages-professor-atividades-001">
                <button class="navbar__icon-btn u-pages-professor-atividades-003" id="btnNotif" aria-label="Notifica&ccedil;&otilde;es">
                    <i class="fi fi-br-bell"></i>
                    <span class="u-pages-professor-atividades-004"></span>
                </button>
                <a href="perfil.html" class="navbar__avatar u-pages-professor-atividades-005" title="Perfil" aria-label="Abrir perfil">A</a>
            </div>
        </header>

        <div class="page-body fade-in">

            <!-- Stats gerais -->
            <div class="grid-4 u-pages-professor-atividades-006" id="statsBar"></div>

            <!-- Busca + filtros -->
            <div class="u-pages-professor-atividades-007">
                <div class="search-wrap">
                    <i class="fi fi-br-search"></i>
                    <input type="text" id="searchInput" placeholder="Buscar atividade&hellip;" oninput="filtrar()">
                </div>
                <select class="filter-select u-pages-professor-atividades-008" id="sortSel" onchange="filtrar()">
                    <option value="default">Ordenar</option>
                    <option value="nome">A&ndash;Z</option>
                    <option value="acertos">Mais Acertos</option>
                </select>
            </div>
            <div class="filter-bar" id="filterBar">
                <button class="filter-chip active" data-f="all">Todas</button>
                <button class="filter-chip" data-f="corpo">Corpo Humano</button>
                <button class="filter-chip" data-f="vocabulario">Vocabul&aacute;rio</button>
                <button class="filter-chip" data-f="emocoes">Emo&ccedil;&otilde;es</button>
                <button class="filter-chip" data-f="animais">Animais</button>
            </div>

            <!-- Listagem por categoria -->
            <div id="atividadesContainer"></div>

        </div>
    </div>
</div>

<!-- Modal Atividade -->
<div class="modal-overlay" id="modalAtiv">
    <div class="modal-box">

        <!-- Cabeçalho da atividade -->
        <div class="u-pages-professor-atividades-009">
            <div class="modal-act-header u-pages-professor-atividades-010">
                <div>
                    <div id="mActNome" class="u-pages-professor-atividades-011"></div>
                    <div id="mActMeta" class="u-pages-professor-atividades-012"></div>
                </div>
            </div>
            <button class="modal-close" onclick="fecharModal()" aria-label="Fechar"><i class="fi fi-br-cross"></i></button>
        </div>

        <!-- Resumo do módulo -->
        <div class="modal-act-stats" id="mActStats"></div>

        <section class="module-activity-details" id="moduleDetails" aria-labelledby="moduleActivitiesTitle">
            <h3 id="moduleActivitiesTitle">Atividades do módulo</h3>
            <div id="mModuleActivities"></div>
        </section>

        <section id="moduleManagement" aria-label="Liberação do módulo">
            <!-- Abas Turma A / B -->
            <div class="u-pages-professor-atividades-013">
                <button class="tab-btn active" id="tabA" onclick="switchTab('A')">Turma A</button>
                <button class="tab-btn"        id="tabB" onclick="switchTab('B')">Turma B</button>
                <button class="tab-btn"        id="tabAll" onclick="switchTab('all')">Todos</button>
            </div>

            <!-- Lista de alunos -->
            <div id="mAlunosList"></div>

            <div class="u-pages-professor-atividades-014">
                <button class="btn btn--secondary" id="btnDesbloquearTodos" onclick="desbloquearTodos()">Liberar módulo para todos</button>
                <button class="btn btn--primary" onclick="fecharModal()">Fechar</button>
            </div>
        </section>
    </div>
</div>

<div id="toast-container"></div>

<script src="../../public/js/pages/professor/pages-professor-atividades-1.js"></script>
</body>
</html>
