<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Atividade adaptativa da plataforma ROAR.">
    <title>ROAR | Atividade</title>
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css">
    <link rel="icon" href="../../public/assets/imagens/favicon-v2.png?v=4" type="image/png" sizes="32x32">
    <script src="../../public/js/roar-theme.js"></script>
    <link rel="stylesheet" href="../../public/css/base/variables.css">
    <link rel="stylesheet" href="../../public/css/base/reset.css">
    <link rel="stylesheet" href="../../public/css/base/typography.css">
    <link rel="stylesheet" href="../../public/css/base/accessibility.css">
    <link rel="stylesheet" href="../../public/css/components/feedback.css">
    <link rel="stylesheet" href="../../public/css/layouts/activity.css">
    <link rel="stylesheet" href="../../public/css/layouts/sombra.css">
    <link rel="stylesheet" href="../../public/css/layouts/memoria.css">
    <link rel="stylesheet" href="../../public/css/layouts/activity-adjustments.css">
</head>

<body class="activity-page" data-auth-role="student">
    <header class="activity-header">
        <a class="activity-back" href="atividades.html" aria-label="Voltar para atividades">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/><path d="M8 12h13"/></svg>
        </a>
        <div class="activity-heading">
            <h1 id="activity-title">Carregando atividade</h1>
            <button class="audio-button" id="repeat-instruction" type="button" aria-label="Ouvir instrução novamente">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 4-6 5H2v6h3l6 5z"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg>
            </button>
            <p id="activity-instruction">Aguarde um momento.</p>
        </div>
        <div class="activity-header-spacer" aria-hidden="true"></div>
    </header>

    <main class="activity-stage" id="activity-stage" aria-live="polite">
        <div class="activity-loading" id="activity-loading">
            <div class="spinner" aria-label="Carregando atividade..." title="Carregando atividade..."></div>
        </div>
    </main>

    <footer class="activity-footer">
        <div class="lex-feedback" aria-live="polite">
            <img src="../../public/assets/imagens/dinoatividade.png" alt="LEX, mascote da ROAR">
            <p id="lex-message">Vamos aprender juntos!</p>
        </div>
        <div class="activity-progress" aria-label="Progresso da atividade">
            <span id="progress-label">0 de 0</span>
            <progress id="activity-progress" value="0" max="1"></progress>
        </div>
        <button class="next-button" id="next-button" type="button" disabled>Próximo <i class="fi fi-br-arrow-right"
                aria-hidden="true"></i></button>
    </footer>

    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="../../public/js/pages/auth/route-guard.js"></script>
    <script src="../../public/js/roar-page-transition.js"></script>
    <script src="../../public/js/roar-avatar.js"></script>
    <script type="module" src="../../public/js/pages/aluno/atividade.js?v=4"></script>
</body>

</html>
