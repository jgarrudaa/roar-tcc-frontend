<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROAR — Cadastro Professor</title>

    <meta name="description" content="Cadastro do professor no sistema ROAR.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css">
    <link rel="stylesheet" href="../../public/css/components/feedback.css">
    <link rel="stylesheet" href="../../public/css/pages/auth.css?v=4">
    <link rel="stylesheet" href="../../public/css/pages/pages-auth-cadastro-professor.css?v=3">
</head>

<body class="auth-page auth-page--teacher-register">
    <main class="auth-card">
        <section class="auth-visual" aria-labelledby="register-greeting">
            <img src="../../public/assets/imagens/logo.svg" alt="ROAR" class="auth-logo">

            <div class="auth-copy">
                <h1 id="register-greeting" class="auth-greeting">
                    Olá, Professor
                </h1>

                <p>
                    <strong class="auth-highlight auth-highlight--green">
                        Junte-se a nós
                    </strong>
                    e gerencie seus alunos.
                    <br>
                    Acompanhe o progresso de cada um
                    <br>
                    e personalize o aprendizado.
                </p>
            </div>

            <div class="auth-mascot-stage" aria-hidden="true">
                <img id="dinoImg" class="auth-dino" src="../../public/assets/imagens/dino2.png" alt=""
                    data-dino-neutral="../../public/assets/imagens/dino2.png"
                    data-dino-hiding="../../public/assets/imagens/dinosenha2-sem-colar.png"
                    data-dino-peeking="../../public/assets/imagens/dino espiando2.png">
            </div>
        </section>

        <section class="auth-form-panel" aria-labelledby="register-title">
            <form id="teacher-register-form" class="auth-form auth-form--register">
                <header class="auth-form-header">
                    <h2 id="register-title">
                        Crie sua conta!
                    </h2>

                    <p class="auth-form-label">
                        Cadastro
                    </p>
                </header>

                <div class="auth-fields">
                    <label class="sr-only" for="nomeInput">
                        Nome
                    </label>

                    <input id="nomeInput" class="auth-input" name="name" type="text" placeholder="Nome"
                        autocomplete="name" required>

                    <label class="sr-only" for="emailInput">
                        E-mail
                    </label>

                    <input id="emailInput" class="auth-input" name="email" type="email" placeholder="E-mail"
                        autocomplete="email" required>

                    <label class="sr-only" for="cpfInput">
                        CPF
                    </label>

                    <input id="cpfInput" class="auth-input" name="cpf" type="text" placeholder="CPF" inputmode="numeric"
                        maxlength="14" autocomplete="off" required>

                    <div class="auth-password-field">
                        <label class="sr-only" for="senha">
                            Senha
                        </label>

                        <input id="senha" class="auth-input" name="password" type="password" placeholder="Senha"
                            autocomplete="new-password" data-auth-secret-input data-secret-label="senha" required>

                        <button id="toggleSenhaIcon" class="auth-password-toggle" type="button" data-auth-secret-toggle
                            aria-label="Mostrar senha" aria-pressed="false">
                            <i class="fi fi-br-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <button class="buttoncadastro" type="submit">
                    Cadastrar
                </button>

                <p class="auth-switch">
                    Já tem uma conta?
                    <a href="login-professor.html" class="auth-link auth-link--strong">
                        Fazer login
                    </a>
                </p>
            </form>

            <form id="teacher-verification-form" class="auth-form auth-form--register" hidden novalidate>
                <header class="auth-form-header">
                    <h2>Confirme seu e-mail</h2>
                    <p class="auth-form-label" id="verificationDescription">
                        Digite o código de 6 números enviado ao seu e-mail.
                    </p>
                </header>

                <div class="auth-fields">
                    <label class="sr-only" for="verificationCodeInput">
                        Código de confirmação
                    </label>

                    <input id="verificationCodeInput" class="auth-input" type="text" inputmode="numeric"
                        autocomplete="one-time-code" maxlength="6" placeholder="Código de 6 números" required>
                </div>

                <button class="buttoncadastro" id="confirmEmailButton" type="submit">
                    Confirmar e-mail
                </button>

                <button class="auth-link auth-link--small" id="resendEmailCodeButton" type="button" disabled>
                    Reenviar em 60s
                </button>

                <a href="login-professor.html" class="auth-link auth-link--small">
                    Voltar para o login
                </a>
            </form>
        </section>
    </main>

    <script src="../../public/js/roar-page-transition.js"></script>
    <script src="../../public/js/pages/auth/auth-interactions.js?v=2"></script>
    <script type="module" src="../../public/js/pages/auth/cadastro-professor.js?v=2"></script>
</body>

</html>
