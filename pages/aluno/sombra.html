<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Monte as peças nas sombras e aprenda os nomes dos animais em inglês com o Lex.">
    <title>ROAR | Jogo das sombras</title>
    <link rel="icon" href="../../public/assets/imagens/favicon-v2.png?v=4" type="image/png">
    <script src="../../public/js/roar-theme.js"></script>
    <link rel="stylesheet" href="../../public/css/base/variables.css">
    <link rel="stylesheet" href="../../public/css/base/reset.css">
    <link rel="stylesheet" href="../../public/css/base/typography.css">
    <link rel="stylesheet" href="../../public/css/base/accessibility.css">
    <link rel="stylesheet" href="../../public/css/layouts/sombra.css">
</head>
<body class="shadow-page">
    <header class="shadow-page-header">
        <a class="shadow-back" href="atividades.html" aria-label="Voltar para atividades">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg>
        </a>
        <div class="shadow-page-heading">
            <span class="shadow-eyebrow">ROAR · APRENDER BRINCANDO</span>
            <h1>Jogo das sombras</h1>
            <p>Monte, escute e aprenda.</p>
        </div>
        <button id="shadow-sound" class="shadow-sound-toggle" type="button" aria-pressed="true">Som ligado</button>
    </header>

    <main class="shadow-page-main">
        <div class="shadow-session-bar">
            <p id="shadow-round" class="shadow-round">Animal 1 de 6</p>
            <label class="shadow-difficulty" for="shadow-difficulty">Peças
                <select id="shadow-difficulty">
                    <option value="2">2 peças</option>
                    <option value="4">4 peças</option>
                    <option value="6">6 peças</option>
                </select>
            </label>
        </div>
        <p class="shadow-instruction" id="activity-instruction">Arraste cada peça até sua sombra.</p>
        <div id="activity-stage" class="shadow-stage" aria-busy="true">
            <p role="status">Preparando as peças…</p>
        </div>
        <noscript><p>Ative o JavaScript do navegador para jogar.</p></noscript>
    </main>

    <footer class="shadow-page-footer">
        <div class="shadow-lex">
            <img src="../../public/assets/imagens/dinoatividade.png" alt="Lex, seu companheiro de aprendizagem" width="72" height="72">
            <p id="lex-message" role="status" aria-live="polite" aria-atomic="true">Vamos montar juntos, no seu ritmo.</p>
        </div>
        <div class="shadow-session-progress">
            <label for="activity-progress" id="progress-label">0 de 6 animais</label>
            <progress id="activity-progress" value="0" max="6"></progress>
        </div>
        <button id="next-button" class="shadow-next" type="button" disabled>Próximo animal <span aria-hidden="true">→</span></button>
    </footer>
    <script type="module" src="../../public/js/pages/aluno/sombra.js"></script>
</body>
</html>
